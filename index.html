<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세미나 실시간 통역</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 상단 조작바 1줄 + 원문 띠 + 통역 2열(프로젝터용 대형 자막) */
:root{
  --bg:#0f1418; --panel:#161d23; --line:#26313a; --fg:#e8eef2; --muted:#8a9aa6;
  --accent:#4fb3a9; --live:#e0a43a; --err:#e06a5a;
  --sans:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Hiragino Sans","Meiryo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --fs:34px; --srcfs:19px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .grp{display:flex;gap:6px;align-items:center}
label{font-size:12px;color:var(--muted);letter-spacing:.04em}
select,button{font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#06100f;border-color:var(--accent);font-weight:600}
#start{background:var(--accent);color:#06100f;border-color:var(--accent);font-weight:600;min-width:96px}
#start.on{background:var(--err);border-color:var(--err);color:#fff}
#status{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
#status.live{color:var(--live)} #status.err{color:var(--err)}
.src{padding:10px 16px;border-bottom:1px solid var(--line);min-height:58px;font-size:var(--srcfs);color:var(--muted)}
.banner{background:var(--err);color:#fff;padding:12px 16px;font-size:16px;font-weight:600;line-height:1.45}
.diag{margin:0;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;color:var(--fg)}
input[type=range]{width:120px;accent-color:var(--accent)}
.val{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;font-variant-numeric:tabular-nums}
.src .tag,.col h2{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent);margin:0 0 4px}
.src .interim{color:var(--live)}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px 16px}
.col+.col{border-left:1px solid var(--line)}
/* 최신 줄을 세로 중간쯤에 두고, 이전 줄은 위로 밀려나며 작아짐. 위쪽 끝은 서서히 사라지게 처리 */
.lines{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:.5em;
  font-size:var(--fs);line-height:1.35;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%)}
.lines::after{content:"";flex:0 0 var(--below,40%)}
.lines p{margin:0;flex:none;transition:font-size .4s ease,opacity .4s ease,color .4s ease}
.lines p.newest{font-weight:600}
.lines p.pending{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:reduce){.lines p{transition:none}}
body.single main{grid-template-columns:1fr}
@media (max-width:700px){main{grid-template-columns:1fr} .col+.col{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="grp"><label>발화 언어</label>
    <div class="seg" id="srcSeg">
      <button data-l="ko" aria-pressed="true">한국어</button>
      <button data-l="en" aria-pressed="false">English</button>
      <button data-l="ja" aria-pressed="false">日本語</button>
    </div>
  </div>
  <button id="start">● 시작</button>
  <div class="grp"><label for="engine">번역</label>
    <select id="engine">
      <option value="auto">자동 (내장 → 온라인)</option>
      <option value="builtin">Chrome 내장 (오프라인)</option>
      <option value="google">Google 온라인</option>
    </select>
  </div>
  <div class="grp"><label for="fsRange">자막 크기</label>
    <button id="fsDown" title="작게 (− 키)">A−</button>
    <input type="range" id="fsRange" min="20" max="200" step="2" value="34">
    <button id="fsUp" title="크게 (+ 키)">A+</button>
    <span id="fsVal" class="val">34px</span>
  </div>
  <div class="grp"><label for="srcRange">원문 크기</label>
    <input type="range" id="srcRange" min="12" max="80" step="1" value="19">
    <span id="srcVal" class="val">19px</span>
  </div>
  <div class="grp"><label for="view">표시</label>
    <select id="view">
      <option value="both">두 언어 모두</option>
      <option value="ko">한국어만</option>
      <option value="en">English만</option>
      <option value="ja">日本語만</option>
    </select>
  </div>
  <div class="grp"><label for="pos">자막 위치</label>
    <select id="pos">
      <option value="50%">가운데</option>
      <option value="40%" selected>가운데 약간 아래</option>
      <option value="25%">아래쪽</option>
      <option value="6%">맨 아래</option>
    </select>
  </div>
  <button id="clear">지우기</button>
  <button id="save">기록 저장</button>
  <button id="full">전체화면</button>
  <button id="diagBtn">진단</button>
  <span id="status">대기</span>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<pre id="diagBox" class="diag" hidden></pre>
<div class="src"><div class="tag" id="srcTag">원문 · 한국어</div><div id="srcText"><span id="finalTxt"></span> <span class="interim" id="interimTxt"></span></div></div>
<main>
  <section class="col a"><h2 id="hA">ENGLISH</h2><div class="lines" id="linesA"></div></section>
  <section class="col b"><h2 id="hB">日本語</h2><div class="lines" id="linesB"></div></section>
</main>
<script>
window.addEventListener("error",e=>{try{setStatus("스크립트 오류: "+e.message,"err");}catch(_){}});
window.addEventListener("unhandledrejection",e=>{try{setStatus("처리되지 않은 오류: "+(e.reason&&e.reason.message||e.reason),"err");}catch(_){}});
const NAMES={ko:"한국어",en:"ENGLISH",ja:"日本語"};
const LOCALE={ko:"ko-KR",en:"en-US",ja:"ja-JP"};
const $=id=>document.getElementById(id);
let src="ko", running=false, rec=null, log=[];
const translators={};
const targets=()=>["ko","en","ja"].filter(l=>l!==src);

function setStatus(t,cls=""){
  const s=$("status");s.textContent=t;s.className=cls;
  const b=$("banner");
  if(cls==="err"){b.textContent="⚠ "+t; b.hidden=false;} else b.hidden=true;
}
function diag(){
  return [
    "주소: "+location.href,
    "보안 주소(isSecureContext): "+(window.isSecureContext?"예":"아니오 ← 마이크 차단 원인"),
    "음성인식 API: "+((window.SpeechRecognition||window.webkitSpeechRecognition)?"있음":"없음 ← 이 브라우저 미지원"),
    "마이크 API: "+(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?"있음":"없음 ← 보안 주소 아님 또는 미지원"),
    "브라우저: "+navigator.userAgent,
    "",
    "[음성인식 확정 결과 원본 — 최근 30개]",
    ...(typeof rawLog!=="undefined"&&rawLog.length?rawLog:["(아직 없음)"])
  ].join("\n");
}
function refreshHeads(){
  const [a,b]=targets();
  $("hA").textContent=NAMES[a]; $("hB").textContent=NAMES[b];
  $("srcTag").textContent="원문 · "+NAMES[src];
  applyView();
}
function applyView(){
  const sel=$("view"), [a,b]=targets();
  // 발화 언어와 같은 표시 옵션은 선택 불가
  [...sel.options].forEach(o=>o.disabled=(o.value===src));
  if(sel.value===src) sel.value="both";
  const v=sel.value;
  document.querySelector(".col.a").hidden=(v!=="both"&&v!==a);
  document.querySelector(".col.b").hidden=(v!=="both"&&v!==b);
  document.body.classList.toggle("single",v!=="both");
}

/* ---------- 번역 ---------- */
async function builtin(text,to){
  if(!("Translator" in self)) throw new Error("no-builtin");
  const key=src+">"+to;
  if(!translators[key]){
    const av=await Translator.availability({sourceLanguage:src,targetLanguage:to});
    if(av==="unavailable") throw new Error("no-pair");
    translators[key]=Translator.create({sourceLanguage:src,targetLanguage:to});
  }
  const t=await translators[key];
  return t.translate(text);
}
async function google(text,to){
  const u="https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+src+"&tl="+to+"&q="+encodeURIComponent(text);
  const r=await fetch(u); if(!r.ok) throw new Error("http "+r.status);
  const j=await r.json(); return j[0].map(x=>x[0]).join("");
}
async function translate(text,to){
  const e=$("engine").value;
  if(e==="builtin") return builtin(text,to);
  if(e==="google") return google(text,to);
  if(!("Translator" in self)) return google(text,to);   // 안드로이드 등 내장 번역 없는 환경
  try{return await builtin(text,to);}catch(_){return google(text,to);}
}

// 나이(0=최신)별 글자 배율과 진하기
const SCALE=[1,.66,.54,.47], OPAC=[1,.62,.45,.34];
function restyle(box){
  const ps=[...box.children], n=ps.length;
  ps.forEach((p,i)=>{
    const age=n-1-i;
    const k=SCALE[Math.min(age,SCALE.length-1)], o=age<OPAC.length?OPAC[age]:Math.max(.18,OPAC[OPAC.length-1]-.06*(age-OPAC.length+1));
    p.style.fontSize="calc(var(--fs) * "+k+")";
    p.style.opacity=o;
    p.classList.toggle("newest",age===0);
  });
}
function addLine(box,txt){
  const p=document.createElement("p"); p.textContent=txt; p.className="pending";
  box.appendChild(p);
  while(box.children.length>20) box.firstChild.remove();
  restyle(box); return p;
}
let last=null;   // 마지막으로 표시한 문장 {entry, pa, pb, seq}
async function handleFinal(text, replaceLast){
  text=text.trim(); if(!text) return;
  $("finalTxt").textContent=text; $("interimTxt").textContent="";
  const [a,b]=targets();
  let entry,pa,pb;
  if(replaceLast && last && last.entry.src===src){
    // 같은 문장이 길어진 경우: 새 줄을 만들지 않고 마지막 줄을 갱신
    ({entry,pa,pb}=last); entry.text=text;
  }else{
    entry={time:new Date().toLocaleTimeString(),src,text}; log.push(entry);
    pa=addLine($("linesA"),"…"); pb=addLine($("linesB"),"…");
  }
  const seq=(last&&last.entry===entry?last.seq:0)+1;
  last={entry,pa,pb,seq};
  const job=async(to,p)=>{
    try{
      const t=await translate(text,to);
      if(last.entry===entry && last.seq!==seq) return;   // 더 최신 갱신이 있으면 늦게 온 번역은 버림
      p.textContent=t; p.classList.remove("pending"); entry[to]=t;
    }catch(err){p.textContent="[번역 실패] "+text; p.classList.remove("pending"); setStatus("번역 오류: "+err.message,"err");}
    p.parentNode.scrollTop=p.parentNode.scrollHeight;
  };
  job(a,pa); job(b,pb);
}

/* 안드로이드: 확정 결과가 조각조각 여러 번 오므로 짧게 모았다가 한 문장으로 처리 */
const norm=s=>s.toLowerCase().replace(/[\s.,!?;:、。！？，「」"'·…-]/g,"");
let pendText="", pendTimer=null, lastShown="", lastShownAt=0;
let recentShown=[];            // 최근 표시한 문장(정규화) 목록 — 시간과 무관하게 재전송을 거름
const rawLog=[];               // 진단용: 음성인식이 실제로 보낸 확정 결과
const MERGE_MS=1200, EXTEND_MS=15000, RECENT_MAX=15;
function flushPending(){
  clearTimeout(pendTimer); pendTimer=null;
  const t=pendText; pendText=""; if(!t) return;
  const n=norm(t), ln=norm(lastShown);
  // 이미 표시한 문장과 같거나 그 일부이면 재전송으로 보고 무시
  if(recentShown.some(r=>r===n || r.startsWith(n))) return;
  // 바로 앞 문장이 길어진 것이면 같은 줄 갱신
  const extend = ln && n.startsWith(ln) && Date.now()-lastShownAt<EXTEND_MS;
  if(extend) recentShown=recentShown.filter(r=>r!==ln);
  recentShown.push(n); if(recentShown.length>RECENT_MAX) recentShown.shift();
  lastShown=t; lastShownAt=Date.now();
  handleFinal(t, extend);
}
function androidFinal(t){
  rawLog.push(new Date().toLocaleTimeString()+"  "+t); if(rawLog.length>30) rawLog.shift();
  if(pendText){
    const a=norm(pendText), b=norm(t);
    if(b.startsWith(a)||a.startsWith(b)){ if(b.length>=a.length) pendText=t; }
    else { flushPending(); pendText=t; }
  } else pendText=t;
  $("interimTxt").textContent=pendText;
  clearTimeout(pendTimer); pendTimer=setTimeout(flushPending, MERGE_MS);
}

/* ---------- 음성 인식 ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IS_ANDROID=/Android/i.test(navigator.userAgent);
const ERR_KO={
  "not-allowed":"마이크 권한 거부됨 — https 주소인지, 사이트 권한에서 마이크 허용인지 확인",
  "service-not-allowed":"음성인식 서비스 차단 — Chrome 앱에서 열었는지 확인(카카오톡 등 앱 내 브라우저 불가)",
  "audio-capture":"마이크를 찾을 수 없음 — 다른 앱이 마이크를 쓰는지 확인",
  "network":"음성인식 서버 연결 실패 — 인터넷 연결 확인",
  "language-not-supported":"이 기기에서 해당 언어 음성인식 미지원 — Google 앱 음성 언어 설정 확인"
};
let lastFinal="";
function makeRec(){
  const r=new SR(); r.lang=LOCALE[src];
  // 안드로이드 Chrome은 continuous 모드에서 결과가 중복·누적되는 문제가 알려져 있어 단발 모드 + 자동 재시작으로 운용
  r.continuous=!IS_ANDROID; r.interimResults=true;
  r.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i], t=res[0].transcript.trim();
      if(res.isFinal){ if(t){ if(IS_ANDROID) androidFinal(t); else handleFinal(t); } }
      else interim+=res[0].transcript;
    }
    if(interim || !IS_ANDROID) $("interimTxt").textContent=interim;
  };
  r.onerror=e=>{ if(e.error==="no-speech"||e.error==="aborted") return;
    setStatus("음성 오류: "+(ERR_KO[e.error]||e.error),"err");
    if(["not-allowed","service-not-allowed","audio-capture","language-not-supported"].includes(e.error)) stop(true); };
  r.onend=()=>{ if(running) setTimeout(()=>{ if(running){ try{r.start();}catch(_){} } }, IS_ANDROID?250:0); };
  return r;
}
async function start(){
  if(!window.isSecureContext){
    setStatus("보안 주소 아님 — https:// 또는 localhost로 열어야 마이크 사용 가능 (현재: "+location.protocol+"//"+location.host+")","err");return;}
  if(!SR){setStatus("이 브라우저는 음성인식 미지원 — Chrome 앱으로 열기","err");return;}
  setStatus("마이크 권한 확인 중…");
  // 권한 창을 명시적으로 띄우기 위해 먼저 마이크를 한 번 요청
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); }
    catch(err){ setStatus("마이크 사용 불가: "+err.name+" — 브라우저 사이트 설정에서 마이크 허용 확인","err"); return; }
  }
  lastFinal="";
  running=true; rec=makeRec();
  rec.onstart=()=>setStatus("● 듣는 중 ("+LOCALE[src]+")","live");
  try{ rec.start(); }
  catch(err){ running=false; setStatus("음성인식 시작 실패: "+(err.message||err.name),"err"); return; }
  $("start").textContent="■ 정지"; $("start").classList.add("on");
  setStatus("음성인식 시작 중…");
  // 내장 번역 모델 미리 준비(사용자 클릭 시점에만 다운로드 허용)
  if($("engine").value!=="google") targets().forEach(t=>builtin("",t).catch(()=>{}));
}
function stop(keepStatus){
  if(pendText) flushPending();
  lastShown=""; lastShownAt=0; recentShown=[];
  running=false; if(rec){rec.onend=null; try{rec.stop();}catch(_){} }
  $("start").textContent="● 시작"; $("start").classList.remove("on");
  if(!keepStatus) setStatus("정지");
}
$("start").onclick=()=>running?stop():start();

$("srcSeg").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  src=b.dataset.l;
  [...$("srcSeg").children].forEach(x=>x.setAttribute("aria-pressed",x===b));
  refreshHeads();
  if(running){stop();start();}
};

/* ---------- 화면 조작 ---------- */
const store={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},
              set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
let fs=Number(store.get("fs"))||34, srcfs=Number(store.get("srcfs"))||19;
function setFs(v){
  fs=Math.max(20,Math.min(200,Math.round(v)));
  document.documentElement.style.setProperty("--fs",fs+"px");
  $("fsRange").value=fs; $("fsVal").textContent=fs+"px"; store.set("fs",fs);
  $("linesA").scrollTop=$("linesA").scrollHeight; $("linesB").scrollTop=$("linesB").scrollHeight;
}
function setSrcFs(v){
  srcfs=Math.max(12,Math.min(80,Math.round(v)));
  document.documentElement.style.setProperty("--srcfs",srcfs+"px");
  $("srcRange").value=srcfs; $("srcVal").textContent=srcfs+"px"; store.set("srcfs",srcfs);
}
$("fsUp").onclick=()=>setFs(fs+6); $("fsDown").onclick=()=>setFs(fs-6);
$("fsRange").oninput=e=>setFs(+e.target.value);
$("srcRange").oninput=e=>setSrcFs(+e.target.value);
setFs(fs); setSrcFs(srcfs);
$("view").onchange=applyView;
function setPos(v){document.documentElement.style.setProperty("--below",v); $("pos").value=v; store.set("pos",v);}
$("pos").onchange=e=>setPos(e.target.value);
if(store.get("pos")) setPos(store.get("pos"));
$("diagBtn").onclick=()=>{const d=$("diagBox"); d.textContent=diag(); d.hidden=!d.hidden;};
$("clear").onclick=()=>{$("linesA").innerHTML="";$("linesB").innerHTML="";$("finalTxt").textContent="";};
$("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$("save").onclick=()=>{
  const rows=["time,source_lang,ko,en,ja"].concat(log.map(r=>{
    const v=l=>'"'+String(r.src===l?r.text:(r[l]||"")).replace(/"/g,'""')+'"';
    return [r.time,r.src,v("ko"),v("en"),v("ja")].join(",");}));
  const blob=new Blob(["﻿"+rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="seminar_transcript_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.type==="range") return;
  if(e.key==="+"||e.key==="=") setFs(fs+6);
  if(e.key==="-"||e.key==="_") setFs(fs-6);
  if(e.key===" "){e.preventDefault();$("start").click();}
  if(e.key==="1") $("srcSeg").children[0].click();
  if(e.key==="2") $("srcSeg").children[1].click();
  if(e.key==="3") $("srcSeg").children[2].click();
});
refreshHeads();
</script>
